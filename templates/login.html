{% extends "base.html" %}

{% block title %}Student Login - Campus Hardware Inventory{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="form-container">

        <div class="back-arrow">

            <a
                href="{{ url_for('index') }}"
                aria-label="Back to account selection"
                title="Back to account selection"
            >
                ←
            </a>

        </div>


        <h1>Student Login</h1>

        <p>
            Sign in to access the Campus Hardware Inventory System.
        </p>


        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password')"
                >
                    Show password
                </button>

            </div>


            <button type="submit" class="btn">
                Student Login
            </button>

        </form>


        <div class="form-links">

            <p>

                <a href="{{ url_for('reset_request') }}">
                    Forgot Password?
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
